server.port=8080

# Database Configuration (H2 In-Memory with H2 Console enabled)
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Python Forecasting Microservice URL
python.forecaster.url=http://localhost:8000/predict-depletion

# Email Notification Configuration (Simulated/Mock by default)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=mock_user
spring.mail.password=mock_pass
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
